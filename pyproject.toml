[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-planner-backend"
version = "2.0.0"
description = "Transit Planner prototype backend combining core routing, SQLite persistence, and provider adapters"
readme = "README_START_HERE.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "api/index.py:app"


[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["reference*", "docs*", "data*", "scripts*"]
